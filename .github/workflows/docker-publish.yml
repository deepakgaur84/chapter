name: Build and Publish Docker Images

# Manual only: run it from the Actions tab with the "Run workflow" button.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'What to build (amd64 = your Intel NAS)'
        required: true
        type: choice
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'

env:
  REGISTRY: ghcr.io

# If you start a second run, the older one is cancelled so they never race.
concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chapter-server
            dockerfile: apps/server/Dockerfile
            context: .
          - image: chapter-web
            dockerfile: apps/web/Dockerfile
            context: .
            build-args: |
              NEXT_PUBLIC_API_URL=/api
          - image: chapter-kokoro
            dockerfile: services/kokoro/Dockerfile
            context: services/kokoro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # amd64 builds (alone or with arm64) publish :latest and a commit tag.
          # arm64-only builds publish :arm64 so they never replace :latest.
          tags: |
            type=raw,value=latest,enable=${{ contains(inputs.platforms || 'linux/amd64', 'amd64') }}
            type=sha,prefix=,enable=${{ contains(inputs.platforms || 'linux/amd64', 'amd64') }}
            type=raw,value=arm64,enable=${{ !contains(inputs.platforms || 'linux/amd64', 'amd64') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
